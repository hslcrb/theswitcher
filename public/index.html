<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="TTF, OTF, WOFF, WOFF2 폰트 변환기">
  <title>폰트 변환기</title>
  <link rel="stylesheet" href="./assets/app.css">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <script type="module" src="./assets/app.js"></script>
</head>
<body>
  <main class="page">
    <header class="top"><h1>폰트 변환기</h1><a href="https://github.com/hslcrb/theswitcher" rel="noopener noreferrer">GitHub ↗</a></header>

    <div class="drop" id="drop">
      <label for="files">파일 선택</label>
      <input id="files" type="file" multiple accept=".ttf,.otf,.woff,.woff2,.ttc,.otc,font/ttf,font/otf,font/woff,font/woff2" aria-describedby="limits">
      <small id="limits">기기별 한도 확인 중</small>
    </div>
    <div class="controls">
      <label for="target">출력 형식</label>
      <select id="target">
        <option value="woff2">WOFF2 · 빠른 변환</option>
        <option value="woff2-compact">WOFF2 · 더 작게 (느림)</option>
        <option value="woff">WOFF</option>
        <option value="original">원본 윤곽 · TTF 또는 OTF</option>
        <option value="ttf">TTF · TrueType 윤곽</option>
        <option value="otf">OTF · CFF 계열 윤곽</option>
      </select>
      <button class="primary" id="start" disabled>변환 시작</button>
      <button class="quiet" id="stop" disabled>중지</button>
    </div>
    <section class="activity" aria-label="진행 상태">
      <div class="status-copy" role="status" aria-atomic="true"><strong id="status">대기</strong><span id="detail"></span></div>
      <progress id="progress" value="0" max="1" aria-label="현재 파일 처리 진행"></progress>
    </section>
    <section aria-labelledby="list-title">
      <div class="queue-heading"><h2 id="list-title">파일 <span id="count">0 / 12개</span></h2><button class="quiet" id="clear" disabled>모두 비우기</button></div>
      <p class="empty" id="empty">파일 없음</p>
      <ul id="jobs" aria-label="파일별 결과"></ul>
    </section>
    <noscript><p>폰트 변환에는 자바스크립트가 필요합니다.</p></noscript>
  </main>
</body>
</html>
